services:
  firebase-emulators:
    image: katyuflow-firebase-emulators:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:29099:9099"
      - "127.0.0.1:28080:8080"
      - "127.0.0.1:24000:4000"
    volumes:
      - firebase_data:/data
    networks:
      - katyuflow_local
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all([9099, 8080].map(port =>
          fetch('http://127.0.0.1:' + port + '/', {signal: AbortSignal.timeout(2000)})
          .then(response => response.body?.cancel()))).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  firebase_data:

networks:
  katyuflow_local:
    driver: bridge
